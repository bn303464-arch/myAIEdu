<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 점심 뭐 먹지?</title>
  <style>
    :root {
      --bg: #f6f6f8;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #ff5a1f;
      --accent-text: #ffffff;
      --line: #e5e5ea;
      --danger: #d92d20;
      --danger-text: #ffffff;
      --danger-bg: #fff4f2;
      --danger-line: #f5c2bc;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
      --motion-duration: 240ms;
      --motion-ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111114;
        --card: #1c1c21;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #ff7a45;
        --accent-text: #111114;
        --line: #2c2c33;
        --danger: #ff8a80;
        --danger-text: #2a1212;
        --danger-bg: #3a1d1d;
        --danger-line: #6b3030;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111114;
      --card: #1c1c21;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #ff7a45;
      --accent-text: #111114;
      --line: #2c2c33;
      --danger: #ff8a80;
      --danger-text: #2a1212;
      --danger-bg: #3a1d1d;
      --danger-line: #6b3030;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      padding-bottom: 96px;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

    header h1 { font-size: 22px; margin: 8px 0 4px; }
    header p { margin: 0; color: var(--muted); font-size: 14px; }

    .filters { margin: 16px 0; display: grid; gap: 12px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip {
      flex: none; border: 1px solid var(--line); background: var(--card);
      color: var(--text); border-radius: 999px; padding: 8px 14px;
      font-size: 14px; cursor: pointer; min-height: 44px;
    }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    label.budget { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    select {
      flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); padding: 0 12px; font-size: 15px;
    }

    .btn-main {
      width: 100%; min-height: 52px; border: 0; border-radius: var(--radius);
      background: var(--accent); color: var(--accent-text);
      font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .btn-main:disabled { opacity: 0.6; cursor: wait; }

    h2 { font-size: 17px; margin: 24px 0 10px; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }

    .card {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
      border: 1px solid var(--line);
    }
    .thumb {
      flex: none; width: 64px; height: 64px; border-radius: 12px;
      background: var(--bg); display: grid; place-items: center; font-size: 34px;
    }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 700; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .price { font-weight: 700; color: var(--accent); margin-top: 6px; font-size: 15px; }
    .badge {
      display: inline-block; font-size: 11px; color: var(--muted);
      border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 4px;
    }
    .order-btn {
      flex: none; min-height: 44px; min-width: 64px; border: 0; border-radius: 10px;
      background: var(--accent); color: var(--accent-text); font-weight: 700; cursor: pointer;
    }

    /* 추천 결과가 다시 그려질 때 카드가 아래에서 부드럽게 자리 잡음 */
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes thumb-settle {
      from { opacity: 0; transform: scale(0.86); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #picks .card {
      animation: rise-in var(--motion-duration) var(--motion-ease) both;
    }
    #picks .card:nth-child(1) { animation-delay: 0ms; }
    #picks .card:nth-child(2) { animation-delay: 60ms; }
    #picks .card:nth-child(3) { animation-delay: 120ms; }
    #picks .thumb {
      animation: thumb-settle var(--motion-duration) var(--motion-ease) both;
    }
    #picks .card:nth-child(1) .thumb { animation-delay: 40ms; }
    #picks .card:nth-child(2) .thumb { animation-delay: 100ms; }
    #picks .card:nth-child(3) .thumb { animation-delay: 160ms; }
    #picks .empty,
    #picks .alert,
    #history .alert {
      animation: fade-in var(--motion-duration) var(--motion-ease) both;
    }

    .alert {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--danger-bg); border: 1px solid var(--danger-line);
      border-radius: var(--radius); padding: 14px; margin: 0 0 12px;
    }
    .alert-mark {
      flex: none; width: 28px; height: 28px; border-radius: 999px;
      background: var(--danger); color: var(--danger-text);
      display: grid; place-items: center; font-weight: 700; font-size: 15px;
    }
    .alert-title { margin: 2px 0 0; font-size: 15px; font-weight: 700; }
    .alert-body { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

    /* 버튼 누름 피드백 */
    .btn-main, .order-btn, .chip {
      transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    .btn-main:active, .order-btn:active, .chip:active {
      transform: scale(0.96);
    }

    .hist-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    }
    .hist-item .info .name { font-size: 15px; }
    .del-btn {
      flex: none; min-height: 36px; border: 1px solid var(--line); background: transparent;
      color: var(--muted); border-radius: 8px; padding: 0 10px; cursor: pointer; font-size: 13px;
    }

    .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 12px 16px; display: flex; justify-content: center;
    }
    .bottom-inner { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; }
    .bottom-inner span { font-size: 14px; color: var(--muted); }
    .bottom-inner strong { color: var(--text); }

    .toast {
      position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
      font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      max-width: min(420px, 90vw); text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error {
      background: var(--card); color: var(--text); text-align: left;
      border: 1px solid var(--danger-line); box-shadow: var(--shadow);
      padding: 12px 14px;
    }
    .toast-title { margin: 0; font-size: 14px; font-weight: 700; }
    .toast-body { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

    /* 동작 줄이기 설정을 켠 사용자에게는 움직임 없이 바로 표시 */
    @media (prefers-reduced-motion: reduce) {
      .toast,
      .btn-main, .order-btn, .chip { transition: none; }
      .btn-main:active, .order-btn:active, .chip:active { transform: none; }
      #picks .card,
      #picks .thumb,
      #picks .empty,
      #picks .alert,
      #history .alert { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>오늘 점심 뭐 먹지?</h1>
      <p>예산과 카테고리를 고르면 메뉴 3개를 골라 드려요.</p>
    </header>

    <section class="filters">
      <div class="chips" id="categories" role="group" aria-label="카테고리"></div>
      <label class="budget">
        예산
        <select id="budget" aria-label="예산">
          <option value="">상관없음</option>
          <option value="7000">7,000원 이하</option>
          <option value="9000">9,000원 이하</option>
          <option value="10000">10,000원 이하</option>
          <option value="12000">12,000원 이하</option>
          <option value="15000">15,000원 이하</option>
        </select>
      </label>
      <button class="btn-main" id="recommend-btn" type="button">메뉴 추천받기</button>
    </section>

    <section aria-live="polite">
      <h2>추천 메뉴</h2>
      <div id="picks"><p class="empty">추천받기 버튼을 눌러 주세요.</p></div>
    </section>

    <section>
      <h2>주문 히스토리</h2>
      <div id="history"></div>
    </section>
  </div>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <span>이번 주 주문 <strong id="count-week">0</strong>건</span>
      <span>오늘 <strong id="count-today">0</strong>건</span>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

<script>
  const state = { category: "" };
  const $ = (id) => document.getElementById(id);

  const CATEGORIES = ["전체", "한식", "중식", "일식", "양식", "분식"];

  function toast(message, options = {}) {
    const el = $("toast");
    const error = options.kind === "error";
    el.classList.toggle("error", error);
    el.setAttribute("role", error ? "alert" : "status");
    el.replaceChildren();
    if (error) {
      const title = document.createElement("p");
      title.className = "toast-title";
      title.textContent = options.title || "문제가 생겼어요";
      const body = document.createElement("p");
      body.className = "toast-body";
      body.textContent = message;
      el.append(title, body);
    } else {
      el.textContent = message;
    }
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove("show"), error ? 4200 : 1800);
  }

  function showAlert(container, title, message) {
    const box = document.createElement("div");
    box.className = "alert";
    box.setAttribute("role", "alert");

    const mark = document.createElement("div");
    mark.className = "alert-mark";
    mark.setAttribute("aria-hidden", "true");
    mark.textContent = "!";

    const copy = document.createElement("div");
    const heading = document.createElement("p");
    heading.className = "alert-title";
    heading.textContent = title;
    const body = document.createElement("p");
    body.className = "alert-body";
    body.textContent = message;
    copy.append(heading, body);
    box.append(mark, copy);

    const old = container.querySelector(".alert");
    if (old) old.remove();
    if (container.querySelector(".card, .hist-item")) container.prepend(box);
    else container.replaceChildren(box);
  }

  function reportError(err, container) {
    const title = err.title || "문제가 생겼어요";
    const message = err.message || "다시 시도해 주세요.";
    if (container) showAlert(container, title, message);
    else toast(message, { kind: "error", title });
  }

  function won(n) {
    return n.toLocaleString("ko-KR") + "원";
  }

  function cleanText(value, fallback, max) {
    if (typeof value !== "string") return fallback;
    const text = value.replace(/\s+/g, " ").trim();
    if (!text) return fallback;
    return text.length > max ? text.slice(0, max) + "…" : text;
  }

  function titleForStatus(status) {
    if (status === 400 || status === 413 || status === 405) return "요청을 확인해 주세요";
    if (status === 404) return "찾을 수 없어요";
    if (status >= 500) return "서버에 문제가 있어요";
    return "요청을 처리하지 못했어요";
  }

  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
    } catch {
      const error = new Error("서버가 응답하지 않아요. 연결을 확인한 뒤 다시 시도해 주세요.");
      error.title = "연결할 수 없어요";
      throw error;
    }

    let data = null;
    try {
      data = await res.json();
    } catch {
      data = null;
    }
    if (!res.ok) {
      const error = new Error(cleanText(
        data && data.detail,
        "요청을 처리하지 못했어요. 잠시 후 다시 시도해 주세요.",
        160
      ));
      error.title = cleanText(data && data.title, titleForStatus(res.status), 40);
      throw error;
    }
    if (data === null || typeof data !== "object") {
      const error = new Error("서버 응답을 읽지 못했어요. 잠시 후 다시 시도해 주세요.");
      error.title = "응답을 확인하지 못했어요";
      throw error;
    }
    return data;
  }

  function renderCategories() {
    const box = $("categories");
    CATEGORIES.forEach((name) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = name;
      const value = name === "전체" ? "" : name;
      btn.setAttribute("aria-pressed", String(state.category === value));
      btn.addEventListener("click", () => {
        state.category = value;
        renderCategories();
      });
      box.appendChild(btn);
    });
  }

  function menuCard(menu, withOrderButton) {
    const card = document.createElement("article");
    card.className = "card";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.textContent = menu.emoji || "🍽️";

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = menu.name;
    if (menu.recent) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "최근 주문";
      name.appendChild(badge);
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${menu.category} · 약 ${menu.eta_min}분`;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = won(menu.price);

    info.append(name, meta, price);
    card.append(thumb, info);

    if (withOrderButton) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "order-btn";
      btn.textContent = "주문";
      btn.addEventListener("click", () => order(menu, btn));
      card.appendChild(btn);
    }
    return card;
  }

  async function recommend() {
    const btn = $("recommend-btn");
    btn.disabled = true;
    btn.textContent = "고르는 중…";
    try {
      const params = new URLSearchParams();
      const budget = $("budget").value;
      if (budget) params.set("budget", budget);
      if (state.category) params.set("category", state.category);
      const data = await api("/api/recommend?" + params.toString());

      const box = $("picks");
      box.replaceChildren();
      if (data.picks.length === 0) {
        box.innerHTML = '<p class="empty">조건에 맞는 메뉴가 없어요. 예산이나 카테고리를 바꿔 보세요.</p>';
        return;
      }
      data.picks.forEach((menu) => box.appendChild(menuCard(menu, true)));
    } catch (err) {
      reportError(err, $("picks"));
    } finally {
      btn.disabled = false;
      btn.textContent = "다시 추천받기";
    }
  }

  async function order(menu, btn) {
    btn.disabled = true;
    try {
      await api("/api/history", { method: "POST", body: JSON.stringify({ menu_id: menu.id }) });
      toast(`${menu.name} 주문을 기록했어요`);
      await Promise.all([loadHistory(), recommend()]);
    } catch (err) {
      reportError(err);
      btn.disabled = false;
    }
  }

  async function removeHistory(id) {
    try {
      await api("/api/history/" + id, { method: "DELETE" });
      toast("기록을 지웠어요");
      loadHistory();
    } catch (err) {
      reportError(err);
    }
  }

  async function loadHistory() {
    try {
      const rows = await api("/api/history");
      const box = $("history");
      box.replaceChildren();

      const today = new Date().toISOString().slice(0, 10);
      const weekAgo = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
      $("count-today").textContent = rows.filter((r) => r.date === today).length;
      $("count-week").textContent = rows.filter((r) => r.date >= weekAgo).length;

      if (rows.length === 0) {
        box.innerHTML = '<p class="empty">아직 주문 기록이 없어요.</p>';
        return;
      }
      rows.slice(0, 30).forEach((r) => {
        const item = document.createElement("div");
        item.className = "hist-item";

        const info = document.createElement("div");
        info.className = "info";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = r.menu_name;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${r.date} · ${r.category} · ${won(r.price)}`;
        info.append(name, meta);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "del-btn";
        del.textContent = "삭제";
        del.addEventListener("click", () => removeHistory(r.id));

        item.append(info, del);
        box.appendChild(item);
      });
    } catch (err) {
      reportError(err, $("history"));
    }
  }

  renderCategories();
  $("recommend-btn").addEventListener("click", recommend);
  loadHistory();
</script>
</body>
</html>
